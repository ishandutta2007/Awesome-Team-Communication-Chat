<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(0.8deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes ping {
        0% { r: 6; opacity: 0.9; }
        80%, 100% { r: 24; opacity: 0; }
      }

      .floating-card-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
      }
      .pulse-circle {
        transform-origin: 1040px 180px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .ping-circle {
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .dashed-connection {
        stroke-dasharray: 6, 6;
        animation: dashMove 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#glowCyan)" rx="16" />
  <rect width="1200" height="360" fill="url(#glowIndigo)" rx="16" />

  <!-- Subtle Ambient Circuit / Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Animated Background Network Connections (Right side to never obscure text) -->
  <g class="pulse-circle" opacity="0.4">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="1040" cy="180" r="160" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
  </g>

  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
    <line x1="940" y1="90" x2="1080" y2="140" class="dashed-connection" />
    <line x1="1080" y1="140" x2="1010" y2="250" class="dashed-connection" />
    <line x1="1010" y1="250" x2="920" y2="220" class="dashed-connection" />
  </g>

  <!-- Right Side Floating Chat UI Elements (Decorative & Animated) -->
  <g class="floating-card-1">
    <!-- Message Pill 1: Slack/Mattermost style -->
    <g transform="translate(900, 65)">
      <rect width="240" height="64" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" filter="url(#subtleGlow)" />
      <circle cx="30" cy="32" r="16" fill="#3b82f6" />
      <text x="30" y="37" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">#</text>
      <text x="56" y="27" font-size="13" font-weight="700" fill="#f1f5f9">#engineering</text>
      <text x="56" y="46" font-size="11" fill="#94a3b8">Mattermost ↔ Zulip synced</text>
      <circle cx="215" cy="24" r="4" fill="#10b981" />
    </g>
  </g>

  <g class="floating-card-2">
    <!-- Message Pill 2: Matrix/E2EE style -->
    <g transform="translate(860, 205)">
      <rect width="270" height="70" rx="14" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" filter="url(#subtleGlow)" />
      <circle cx="32" cy="35" r="16" fill="#0d9488" />
      <text x="32" y="40" font-size="13" fill="#ffffff" text-anchor="middle">🔒</text>
      <text x="58" y="29" font-size="13" font-weight="700" fill="#f8fafc">Matrix / Element E2EE</text>
      <text x="58" y="48" font-size="11" fill="#38bdf8">Decentralized &amp; Sovereign</text>
      <circle cx="245" cy="35" r="5" fill="#06b6d4" />
      <circle class="ping-circle" cx="245" cy="35" r="6" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header & Core Info (Crisp, High Contrast, Perfectly Legible) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Status Tag -->
    <g transform="translate(0, 48)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="15" r="5" fill="#10b981" />
      <text x="30" y="20" font-size="12" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">Awesome Team Chat</text>
    <text x="0" y="174" font-size="28" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">&amp; Communication Platforms</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="214" font-size="15" fill="#94a3b8" font-weight="500">
      Enterprise SaaS Suites, Async Topic Threading &amp; Self-Hosted Open-Source Sovereignty
    </text>

    <!-- Feature Badges Flow in Foreground -->
    <g transform="translate(0, 245)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="65" y="21" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🏢 Enterprise SaaS</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(142, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="72" y="21" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🚀 Self-Hosted FOSS</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(299, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="70" y="21" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">💬 Async Threading</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(451, 0)">
        <rect width="140" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="70" y="21" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">🔒 Matrix &amp; E2EE</text>
      </g>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.7" />
</svg>
